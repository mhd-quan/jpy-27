name: TripKit

on:
  push:
    paths: ['ios/**', 'scripts/**', 'src/data/**', 'src/lib/**', 'research/**', '.github/workflows/tripkit.yml']
  pull_request:
    paths: ['ios/**', 'scripts/**', 'src/data/**', 'src/lib/**', 'research/**', '.github/workflows/tripkit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The app ships JSON exported from the site's data: it must match the sources it came from.
  data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # all history: the id check compares with an earlier commit's exported plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # on its own, before the fixture is made: a plan that cannot be kept and a fixture made from it
      # would agree with each other
      - name: Plan is feasible
        run: node scripts/check-plan.mjs && node --test 'scripts/*.test.mjs'
      # the app records visits by item id: no visit changes its id without an entry in
      # src/data/id-renames.ts. A push compares with the commit before it (a new branch or a force push:
      # with HEAD^ when its export has ids, else origin/main), a pull request with its base. Until main
      # carries ids a pull request into main prints the skip, and since each push is compared with the
      # one before, a red push can be followed by a green one: the red run stays in the branch history.
      - name: Item ids are stable
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            set -- "$BEFORE"
          else
            set -- HEAD^ origin/main
            echo "no earlier commit for this run: comparing with HEAD^ if its export has ids, else origin/main"
          fi
          node scripts/check-ids.mjs "$@"
      # a save on the user's path says when it fails: no `try?` on a save in the app, but for the
      # two best-effort copies marked as such
      - name: Saves are not silent
        run: node scripts/lint-saves.mjs
      # every animation is a Motion token through Motion.reduced (Reduce Motion), or says why not
      - name: Animations are Motion tokens
        run: node scripts/lint-motion.mjs
      - run: npm run ios:data
      - run: node scripts/check-plan.mjs > ios/Packages/TripKit/Tests/TripKitTests/Fixtures/check-plan.txt
      - name: Exported data is current
        run: git diff --exit-code

  # The plan clock, replanner, ride tracking and menu matching, on Linux.
  swift:
    runs-on: ubuntu-24.04
    container: swift:6.2.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/Packages/TripKit

  # The app and its widgets, compiled for the simulator with no signing: the only place app code
  # builds outside a Mac. A newer push to the same ref cancels a build still running.
  app:
    name: App builds
    runs-on: macos-26
    timeout-minutes: 40
    concurrency:
      group: app-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Xcode 26.2 (Swift 6.2.3), the oldest the app supports and the one on the owner's Mac: a newer
      # Xcode would accept code this one rejects. A missing Xcode fails here, not on another one.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      # SwiftPM's artifact cache can refuse the MapLibre zip at resolution ("…MapLibre.dynamic.xcframework.zip
      # already exists in file system"): 4 of the early runs, once on a re-run of the same job. The pin cannot
      # change that, so on a failure the cached artifacts are cleared and the packages resolved once more
      - name: Resolve packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies -project JP27.xcodeproj -scheme JP27 || {
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            xcodebuild -resolvePackageDependencies -project JP27.xcodeproj -scheme JP27
          }
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project JP27.xcodeproj -scheme JP27 -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      # TripKit's tests on Darwin's Foundation as well as Linux's (job swift): dates are parsed and
      # written by the same code on both, and both must agree
      - name: TripKit tests (macOS)
        run: swift test --package-path ios/Packages/TripKit
      - name: Warnings
        if: always()
        run: |
          log="$RUNNER_TEMP/xcodebuild.log"
          touch "$log"
          # xcodebuild repeats a warning for each pass that sees it
          grep -E ': warning: ' "$log" | sort -u > "$RUNNER_TEMP/warnings.txt" || true
          grep -E '/ios/(JP27|JP27Widgets|Shared)/' "$RUNNER_TEMP/warnings.txt" > "$RUNNER_TEMP/own.txt" || true
          total=$(wc -l < "$RUNNER_TEMP/warnings.txt" | tr -d ' ')
          own=$(wc -l < "$RUNNER_TEMP/own.txt" | tr -d ' ')
          echo "$total warnings in the build, $own in ios/JP27, ios/JP27Widgets, ios/Shared"
          cat "$RUNNER_TEMP/own.txt"
          {
            echo "### App build warnings"
            echo
            echo "$total in the build, $own in ios/JP27, ios/JP27Widgets, ios/Shared"
            if [ "$own" -gt 0 ]; then
              echo
              echo '```'
              cat "$RUNNER_TEMP/own.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
